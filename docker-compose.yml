services:
  airflow:
    build: .
    command: standalone
    ports:
      - "8081:8080"
    env_file: .env
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - PYTHONPATH=/opt/airflow/workspace/src
      - DBT_PROFILES_DIR=/root/.dbt

    volumes:
      - .:/opt/airflow/workspace
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./airflow_covid_19_vb:/opt/airflow/dbt

    working_dir: /opt/airflow/workspace
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
